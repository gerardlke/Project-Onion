version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: project_onion_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
    container_name: project_onion_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  frontend:
    build:
      context: ./universe-web
    container_name: project_onion_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./universe-web:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: